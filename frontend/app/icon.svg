<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Fovea's mark: the red recognition letter between the reader's two notches. -->
  <style>
    .paper { fill: #f5f2eb; }
    .ink { fill: #1d1b18; }
    .orp { fill: #c4372c; }
    @media (prefers-color-scheme: dark) {
      .paper { fill: #161513; }
      .ink { fill: #e8e4da; }
      .orp { fill: #e5594d; }
    }
  </style>
  <rect class="paper" width="32" height="32" rx="6" />
  <rect class="ink" x="15" y="3" width="2" height="6" rx="1" />
  <rect class="ink" x="15" y="23" width="2" height="6" rx="1" />
  <text class="orp" x="16" y="21.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700">o</text>
</svg>
