[project]
name = "fovea-backend"
version = "0.1.0"
description = "Fovea - adaptive RSVP speed reader backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "pymupdf>=1.24",
    "bcrypt>=4.2",
    "pyjwt>=2.9",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
